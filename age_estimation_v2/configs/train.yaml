seed: 42
device: auto

data:
  data_dir: "UTKface/UTKface_Aligned&cropped/UTKFace"
  split_csv: "age_estimation_v2/data/splits/utkface_split.csv"
  image_size: 224
  min_age: 0
  max_age: 100
  num_workers: 0

model:
  backbone: resnet18
  pretrained: true
  dropout: 0.2

train:
  batch_size: 16
  epochs: 30
  learning_rate: 0.0003
  weight_decay: 0.0001
  mae_weight: 0.2
  patience: 6
  checkpoint_dir: "age_estimation_v2/checkpoints"
  run_dir: "age_estimation_v2/runs"
